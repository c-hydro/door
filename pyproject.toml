[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "door"
version = "2.4.0"
description = "A package for operational retrieval of raster data from different sources"
authors = [
    { name = "Andrea Libertino", email = "andrea.libertino@cimafoundation.org" },
    { name = "Luca Trotter", email = "luca.trotter@cimafoundation.org" },
    { name = "Michel Isabellon"},
    { name = "Checco Avanzi"}
]
maintainers = [
    { name = "Andrea Libertino", email = "andrea.libertino@cimafoundation.org" },
    { name = "Luca Trotter", email = "luca.trotter@cimafoundation.org"}
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: ECPL License",
    "Operating System :: OS Independent",
]

# mandatory dependencies for basic functionality
# Pin the verified fix/raster-netcdf commit: version 2.4.0 alone does not
# guarantee Dataset-aware NetCDF writing and template alignment.
# RemoteDataset is imported by d3tools, so its remote dependencies are required.
dependencies = [
    "d3tools[remote-data]@git+https://github.com/c-hydro/d3tools@34ecf5816e1286c4c10de1921a1a265b92f4ba13",
    "numpy~=2.3.5",
    "rioxarray~=0.20.0",
    "rasterio~=1.4",
    "xarray~=2025.11.0",
    "requests~=2.32.5",
    "cfgrib~=0.9.15.0",
    "eccodeslib~=2.45.1",       #this shouldn't be needed (dependency of cfgrib), but uv somethimes fails to resolve it
    "netcdf4~=1.7.3",
    "h5netcdf~=1.7.3",
    "h5py~=3.15.1",             #only for viirs_downloader
    "pyhdf~=0.11.6",            #only for modis_downloader
    "cdsapi~=0.7.7",            #only for cds_downloader
    "ecmwf-opendata~=0.3.35",   #0.1 degree and split surface/pressure-level files
    "multiurl",            #explicitly used to bound ECMWF Open Data retries
    "aiohttp~=3.13.3",
    "pydap~=3.5.9",
    "paramiko~=4.0.0",
    "pg8000~=1.31.5", # pure-Python PostgreSQL client for FANFAR
    "dask~=2025.11.0"
]

[project.urls]
Repository = "https://github.com/c-hydro/door"

[project.optional-dependencies]
# dependencies for drops data
drops = [
    "drops2@git+https://github.com/CIMAFoundation/drops2@v0.7.0",
    "pandas~=2.3.3"
]
